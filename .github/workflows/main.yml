name: CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Dart 3.12.2 — igual que tu máquina. flutter_lints ^6.0.0 y el
          # pubspec.lock requieren Dart >= 3.10; Flutter 3.29.0 (Dart 3.7.0)
          # hace fallar `flutter pub get`.
          flutter-version: '3.44.2'
          channel: 'stable'

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Lint (flutter analyze)
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Run tests
        run: flutter test

      # ---- Release firmado: solo en push a main. Los PRs (sobre todo de
      # forks) no tienen acceso a secrets, así que aquí solo se analiza y testea.
      - name: 🏗️ Decode Keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEY_STORE_BASE64: ${{ secrets.KEY_STORE_BASE64 }}
        run: |
          if [ -z "$KEY_STORE_BASE64" ]; then
            echo "::error::El secret KEY_STORE_BASE64 no está configurado"
            exit 1
          fi
          echo "$KEY_STORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: 🔑 Create key.properties
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=$KEY_STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 🏗️ Build App Bundle (Release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: flutter build appbundle --release

      - name: 📤 Upload AAB artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: chroma_memory-release.aab
          path: build/app/outputs/bundle/release/app-release.aab

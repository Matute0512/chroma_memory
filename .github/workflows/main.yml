name: CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'  # O la versión que tengas local
          channel: 'stable'

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Lint (flutter analyze)
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Run tests
        run: flutter test

      - name: 🏗️ Decode Keystore
        run: |
          echo "${{ secrets.KEY_STORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
      - name: 🏗️ Decode Keystore
        run: |
            echo "${{ secrets.KEY_STORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
      - name: 🏗️ Build App Bundle (Release)
        run: |
          flutter build appbundle \
            --release \
            --dart-define=KEY_STORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }} \
            --dart-define=KEY_PASSWORD=${{ secrets.KEY_PASSWORD }} \
            --dart-define=KEY_ALIAS=${{ secrets.KEY_ALIAS }}
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: 📤 Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: chroma_memory-release.aab
          path: build/app/outputs/bundle/release/app-release.aab
